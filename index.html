  <body>
    <div id="root"></div>
    <script>
      (() => {
        const onLocalhost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
        const devEntry = '/src/main.jsx';
        const prodEntry = './assets/main.js';
        const prodCss = './assets/main.css';

        const ensureProdCss = () => {
          const existing = document.querySelector(`link[rel="stylesheet"][href="${prodCss}"]`);
          if (existing) return;
          const css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = prodCss;
          document.head.appendChild(css);
        };

        const loadEntry = (src) => {
          const script = document.createElement('script');
          script.type = 'module';
          script.src = src;
          document.body.appendChild(script);
        };

        if (!onLocalhost) {
          ensureProdCss();
          loadEntry(prodEntry);
          return;
        }

        // Local static previews (e.g., python -m http.server dist) do not expose /src.
        // Probe once and fall back to production assets to avoid blank local pages.
        fetch(devEntry, { method: 'HEAD' })
          .then((response) => response.ok)
          .catch(() => false)
          .then((hasDevEntry) => {
            if (hasDevEntry) {
              loadEntry(devEntry);
              return;
            }
            ensureProdCss();
            loadEntry(prodEntry);
          });
      })();
    </script>
  </body>
